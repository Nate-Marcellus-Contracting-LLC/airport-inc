name: Lint Lua Code

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Validate Lua Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      
      - name: Run Lua syntax check
        run: |
          find src -name "*.lua" -type f | while read file; do
            lua -e "loadfile('$file')" || { echo "Syntax error in $file"; exit 1; }
          done
          echo "✓ All Lua files passed syntax check"
