<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f0f0f0;
    }

    /* Gray slightly transparent bar, full width */
    .ui-bar {
      position: fixed;
      bottom: 40px;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(128, 128, 128, 0.5);
    }

    /* Yellow adorne above center of the bar */
    .ui-adorne {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: #FFD700;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="ui-bar"></div>
  <div class="ui-adorne"></div>
</body>
</html>
