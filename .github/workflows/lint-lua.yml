name: Lint Lua Code

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Validate Lua Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      
      - name: Install luacheck
        run: luarocks install luacheck
      
      - name: Run luacheck on all Lua files
        run: |
          find src -name "*.lua" -type f | xargs luacheck --std roblox
      
      - name: Validate project structure
        run: |
          # Check that all directories in .gitignore are excluded
          if grep -q "node_modules" .gitignore; then
            echo "✓ node_modules is in .gitignore"
          fi
          
          # Check default.project.json is valid JSON
          python3 -c "import json; json.load(open('default.project.json'))" && echo "✓ default.project.json is valid JSON"
          
          # Verify all source directories exist
          for dir in ServerScriptService ServerStorage ReplicatedStorage ReplicatedFirst StarterPlayer StarterGui StarterPack SoundService; do
            if [ -d "src/$dir" ]; then
              echo "✓ src/$dir exists"
            else
              echo "✗ Missing: src/$dir"
              exit 1
            fi
          done
